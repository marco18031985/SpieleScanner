name: APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk SpieleScanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpieleScanner
          path: SpieleScanner.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spiele-Scanner 1.0.${{ github.run_number }}
          body: Zum Installieren SpieleScanner.apk auf dem Handy herunterladen und öffnen.
          files: SpieleScanner.apk
          make_latest: true
